name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # PBT-08: seedは毎回ログに出力される（[PBT] fast-check seed=...）。再現は PBT_SEED=<seed> npm test
      - run: npm test
      - run: npm run build:web
      - run: npm run build:api
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm ci
        working-directory: infra
      - run: npm run typecheck
        working-directory: infra
      - run: npm test
        working-directory: infra
      # 合成のみ。CIからはデプロイしない
      - run: npx cdk synth --quiet --no-notices
        working-directory: infra
